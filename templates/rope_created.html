{% extends "base.html" %}

{% block title %}Rope Created{% endblock %}

{% block content %}

<h2>Rope Created Successfully!</h2>

<p><strong>Rope ID:</strong> {{ rope_id }}</p>

<p><strong>Rope Link:</strong></p>

<div style="margin-bottom:15px;">
    <input 
        type="text" 
        value="{{ full_url }}" 
        id="ropeLink" 
        readonly
        style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
</div>

<button class="btn" onclick="copyLink()">Copy Link</button>
<a class="btn" href="{{ full_url }}" target="_blank">Open Rope Page</a>

<p id="copyStatus" style="margin-top:10px; color:green; font-weight:bold;"></p>

<hr style="margin:30px 0;">

<h3>QR Code:</h3>

<div style="margin:20px 0; text-align:center;">
    <div id="qrWrapper" style="display:inline-block; padding:18px; background:white; border-radius:8px;"></div>
</div>

<button class="btn" onclick="downloadQR()">Download QR Code</button>

<br><br>
<a class="btn" href="/admin">Create Another Rope</a>

<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function copyLink() {
    var copyText = document.getElementById("ropeLink");
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);

    document.getElementById("copyStatus").innerText = "✅ Link Copied!";
}

// Generate QR (optimized for display)
window.onload = function() {
    new QRCode(document.getElementById("qrWrapper"), {
        text: "{{ full_url }}",
        width: 180,
        height: 180,
        correctLevel: QRCode.CorrectLevel.L
    });
};

// Download QR (high resolution for printing)
function downloadQR() {
    var tempDiv = document.createElement("div");

    var tempQR = new QRCode(tempDiv, {
        text: "{{ full_url }}",
        width: 600,
        height: 600,
        correctLevel: QRCode.CorrectLevel.L
    });

    setTimeout(() => {
        var canvas = tempDiv.querySelector("canvas");

        if (!canvas) {
            alert("QR generation failed!");
            return;
        }

        var image = canvas.toDataURL("image/jpeg", 1.0);

        var link = document.createElement('a');
        link.href = image;
        link.download = "{{ rope_id }}.jpg";
        link.click();
    }, 300);
}
</script>

{% endblock %}

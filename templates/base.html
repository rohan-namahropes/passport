<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %} | Rope Passport</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f6f8;
        }

        header {
            background: linear-gradient(135deg, #0B3A66, #072844);
            color:white;
            padding:14px 30px;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .brand {
            display:flex;
            align-items:center;
            gap:12px;
        }

        .brand img {
            height:38px;
            filter: brightness(0) invert(1) contrast(1.2);
        }

        .brand-title {
            font-size:18px;
            font-weight:bold;
            letter-spacing:0.5px;
        }

        .brand-sub {
            font-size:12px;
            opacity:0.8;
        }

        .container {
            max-width:1100px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 6px 20px rgba(0,0,0,0.05);
        }

        /* ✅ BUTTONS (clean + responsive) */
        .btn {
            background:#0B3A66;
            color:white;
            padding:10px 18px;
            border:none;
            border-radius:6px;
            text-decoration:none;
            font-size:14px;
            cursor:pointer;
            display:inline-block;
            margin:5px 5px 5px 0;
        }

        .btn:hover {
            background:#072844;
        }

        .btn-orange {
            background:#F58220;
        }

        .btn-orange:hover {
            background:#d86f17;
        }

        /* ✅ BUTTON GROUP (center aligned actions) */
        .action-wrapper {
            display:flex;
            justify-content:center;
            margin-top:20px;
        }

        .btn-group {
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:10px;
        }

        /* ✅ TABLE RESPONSIVE FIX */
        .table-wrapper {
            overflow-x:auto;
        }

        table {
            width:100%;
            border-collapse:collapse;
            min-width:600px;
        }

        th, td {
            padding:10px;
            border-bottom:1px solid #eee;
            text-align:left;
        }

        th {
            background:#f0f3f6;
        }

        /* ✅ STATUS COLORS */
        .status-active {
            color:#00FF00;
            font-weight:bold;
        }

        .status-due {
            color:#F58220;
            font-weight:bold;
        }

        .status-retired {
            color:#d62828;
            font-weight:bold;
        }

        /* ✅ MOBILE FIXES */
        @media (max-width: 600px) {

            .btn-group {
                flex-direction:column;
                width:100%;
                align-items:center;
            }

            .btn {
                width:90%;
                max-width:300px;
                margin:8px 0;
                text-align:center;
            }

            th, td {
                font-size:12px;
                padding:8px;
            }
        }

        footer {
            text-align:center;
            padding:20px;
            font-size:12px;
            color:#777;
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <img src="https://www.namahropes.com/wp-content/uploads/2025/05/namah-logo-horizontal-color.png.png" alt="Namah Ropes Logo">
        <div>
            <div class="brand-title">Rope Passport</div>
            <div class="brand-sub">Namah Ropes – Rope Lifecycle Tracking</div>
        </div>
    </div>

    <div>
        {% if session.get("is_admin") %}
            Admin Logged In
        {% endif %}
    </div>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    © 2026 Namah Ropes | Rope Passport System
</footer>

</body>
</html>

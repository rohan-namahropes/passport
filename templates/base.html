<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %} | Rope Passport</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --navy: #102d40;
            --navy-deep: #071923;
            --ink: #202b30;
            --muted: #687378;
            --page: #f2f0ea;
            --surface: #ffffff;
            --border: #d9ddda;
            --orange: #d96f26;
            --green: #287347;
            --red: #9c3e3e;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: var(--page);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 15px;
            line-height: 1.5;
        }

        header {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 13px 16px;
            color: var(--ink);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .brand img {
            display: block;
            width: auto;
            height: 27px;
            flex: 0 0 auto;
        }

        .brand-title {
            color: var(--navy);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.09em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .brand-sub {
            margin-top: 2px;
            color: var(--muted);
            font-size: 8px;
            letter-spacing: 0.05em;
            line-height: 1.2;
        }

        header > div:last-child {
            color: var(--navy);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.2;
            text-align: right;
            white-space: nowrap;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 0;
            background: var(--surface);
            overflow: hidden;
        }

        h1,
        h2,
        h3 {
            color: var(--navy-deep);
            line-height: 1.15;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--orange);
            outline-offset: 3px;
        }

        .btn,
        button:not(.btn) {
            appearance: none;
            min-height: 42px;
            padding: 10px 16px;
            color: #fff;
            background: var(--navy);
            border: 1px solid var(--navy);
            border-radius: 4px;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            cursor: pointer;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn:hover,
        .btn:focus-visible,
        button:not(.btn):hover,
        button:not(.btn):focus-visible {
            color: #fff;
            background: var(--navy-deep);
            border-color: var(--navy-deep);
        }

        .btn-orange {
            background: var(--orange);
            border-color: var(--orange);
        }

        .btn-orange:hover,
        .btn-orange:focus-visible {
            background: #b9571b;
            border-color: #b9571b;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        input,
        select,
        textarea {
            max-width: 100%;
            min-height: 42px;
            padding: 9px 11px;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid #c7cfcc;
            border-radius: 4px;
            font: inherit;
            line-height: 1.3;
        }

        input:not([type="hidden"]),
        select,
        textarea {
            width: 100%;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            color: var(--navy);
            background: #f5f6f3;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .status-active,
        .status-due,
        .status-retired {
            display: inline-block;
            font-weight: 700;
        }

        .status-active { color: var(--green); }
        .status-due { color: #a9561c; }
        .status-retired { color: var(--red); }

        footer {
            max-width: 620px;
            margin: 0 auto;
            padding: 12px 16px 22px;
            color: var(--muted);
            background: var(--surface);
            font-size: 9px;
            letter-spacing: 0.06em;
            text-align: center;
        }

        @media (min-width: 700px) {
            header {
                padding: 15px 28px;
            }

            .brand img {
                height: 30px;
            }

            .container,
            footer {
                max-width: 760px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <img src="https://www.namahropes.com/wp-content/uploads/2025/05/namah-logo-horizontal-color.png.png" alt="Namah Ropes Logo">
        <div>
            <div class="brand-title">Rope Passport</div>
            <div class="brand-sub">Namah Ropes – Rope Lifecycle Tracking</div>
        </div>
    </div>

    <div>
        {% if session.get("is_admin") %}
            Admin Logged In
        {% endif %}
    </div>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    © 2026 Namah Ropes | Rope Passport System
</footer>

</body>
</html>

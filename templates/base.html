<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}{% endblock %} | Rope Passport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        :root { --ink:#101923; --paper:#f5f3ed; --muted:#9aa2a7; --lime:#c7ef38; --line:rgba(255,255,255,.18); }
        * { box-sizing:border-box; }
        html, body { margin:0; min-height:100%; }
        body { font-family:Arial, Helvetica, sans-serif; background:var(--paper); color:var(--ink); }
        a { color:inherit; }
        .site-header, .site-footer { display:none; }
        .container { min-height:100vh; }
        .btn { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:7px; padding:12px 18px; background:var(--ink); color:white; font-size:13px; font-weight:700; text-decoration:none; cursor:pointer; }
        .btn:hover { opacity:.9; }
        .status-active { color:#25783c; font-weight:700; }
        .status-due { color:#b86c13; font-weight:700; }
        .status-retired { color:#bf3b35; font-weight:700; }
        .table-wrapper { overflow-x:auto; }
        @media (max-width:600px) { .container { width:100%; } }
    </style>
</head>
<body>
    <header class="site-header"></header>
    <main class="container">{% block content %}{% endblock %}</main>
    <footer class="site-footer">© 2026 Namah Ropes | Rope Passport System</footer>
</body>
</html>

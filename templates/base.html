<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %} | Rope Passport</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --navy: #12334a;
            --navy-deep: #0b2436;
            --ink: #1e2a31;
            --muted: #647078;
            --page: #f5f3ee;
            --surface: #ffffff;
            --surface-soft: #fafaf8;
            --border: #dce2e1;
            --border-strong: #c8d1d1;
            --orange: #d96f26;
            --orange-deep: #b95518;
            --green: #23704f;
            --green-soft: #e8f3ed;
            --red: #a33e3e;
            --red-soft: #f8eaea;
            --shadow: 0 8px 24px rgba(20, 42, 54, 0.06);
            --radius: 8px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--page);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 15px;
            line-height: 1.6;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 16px 15px;
            color: var(--ink);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand img {
            width: auto;
            height: 30px;
            flex: 0 0 auto;
        }

        .brand-title {
            color: var(--navy);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .brand-sub {
            max-width: 190px;
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.02em;
            line-height: 1.35;
        }

        header > div:last-child {
            color: var(--navy);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.3;
            text-align: right;
            white-space: nowrap;
        }

        .container {
            width: calc(100% - 24px);
            max-width: 1180px;
            margin: 20px auto;
            padding: 22px 16px 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        h1,
        h2,
        h3 {
            margin: 0 0 18px;
            color: var(--navy-deep);
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        h1 { font-size: 27px; }
        h2 { font-size: 22px; }
        h3 { font-size: 18px; }

        p {
            margin: 0 0 14px;
        }

        strong {
            color: var(--navy-deep);
            font-weight: 700;
        }

        .btn,
        button:not(.btn) {
            appearance: none;
            min-height: 44px;
            padding: 10px 16px;
            color: #fff;
            background: var(--navy);
            border: 1px solid var(--navy);
            border-radius: 6px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
            cursor: pointer;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 5px 6px 5px 0;
            text-decoration: none;
        }

        .btn:hover,
        .btn:focus-visible,
        button:not(.btn):hover,
        button:not(.btn):focus-visible {
            color: #fff;
            background: var(--navy-deep);
            border-color: var(--navy-deep);
        }

        .btn:active,
        button:active {
            transform: translateY(1px);
        }

        .btn-orange {
            background: var(--orange);
            border-color: var(--orange);
        }

        .btn-orange:hover,
        .btn-orange:focus-visible {
            background: var(--orange-deep);
            border-color: var(--orange-deep);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(217, 111, 38, 0.35);
            outline-offset: 2px;
        }

        .action-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .table-wrapper {
            width: 100%;
            margin: 18px 0;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 600px;
            background: var(--surface);
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--navy-deep);
            background: var(--surface-soft);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover {
            background: #fcfcfa;
        }

        .status-active,
        .status-due,
        .status-retired {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.35;
        }

        .status-active {
            color: var(--green);
            background: var(--green-soft);
            border: 1px solid #c5e1d1;
        }

        .status-due {
            color: var(--orange-deep);
            background: #fff1e7;
            border: 1px solid #f1c9ae;
        }

        .status-retired {
            color: var(--red);
            background: var(--red-soft);
            border: 1px solid #e9caca;
        }

        form {
            max-width: 680px;
        }

        label {
            color: var(--navy-deep);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            max-width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 5px;
            font: inherit;
            line-height: 1.35;
        }

        input:not([type="hidden"]),
        select,
        textarea {
            width: 100%;
        }

        input[type="file"] {
            padding: 8px;
            background: var(--surface-soft);
        }

        input[readonly] {
            background: var(--surface-soft);
        }

        footer {
            padding: 6px 16px 24px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.02em;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 599px) {
            .btn-group {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-group .btn {
                width: 100%;
            }

            th,
            td {
                padding: 10px 12px;
            }
        }

        @media (min-width: 600px) {
            header {
                padding: 18px 28px;
            }

            .brand img {
                height: 34px;
            }

            .brand-title {
                font-size: 18px;
            }

            .brand-sub {
                font-size: 11px;
            }

            .container {
                width: calc(100% - 48px);
                margin: 30px auto;
                padding: 30px 28px 36px;
            }

            .btn-group {
                justify-content: flex-start;
            }
        }

        @media (min-width: 900px) {
            header {
                padding-right: 44px;
                padding-left: 44px;
            }

            .container {
                margin-top: 42px;
                margin-bottom: 42px;
                padding: 38px 42px 44px;
            }

            h1 { font-size: 32px; }
            h2 { font-size: 25px; }
        }

        @media (min-width: 1200px) {
            .container {
                width: calc(100% - 80px);
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <img src="https://www.namahropes.com/wp-content/uploads/2025/05/namah-logo-horizontal-color.png.png" alt="Namah Ropes Logo">
        <div>
            <div class="brand-title">Rope Passport</div>
            <div class="brand-sub">Namah Ropes – Rope Lifecycle Tracking</div>
        </div>
    </div>

    <div>
        {% if session.get("is_admin") %}
            Admin Logged In
        {% endif %}
    </div>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    © 2026 Namah Ropes | Rope Passport System
</footer>

</body>
</html>

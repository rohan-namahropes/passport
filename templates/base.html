<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}{% endblock %} | Rope Passport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        :root { --ink:#142029; --paper:#f5f3ec; --paper-deep:#ebe9df; --muted:#6f7977; --line:#d8d8cf; --lime:#c8ee39; --orange:#ef603b; --green:#2d8447; }
        * { box-sizing:border-box; }
        html,body { margin:0; min-height:100%; }
        body { font-family:Arial,Helvetica,sans-serif; background:var(--paper); color:var(--ink); }
        a { color:inherit; }
        .site-header,.site-footer { display:none; }
        .container { min-height:100vh; }
        .btn { display:inline-flex; align-items:center; justify-content:center; min-height:42px; border:1px solid var(--ink); border-radius:5px; padding:11px 16px; background:var(--ink); color:#fff; font-size:12px; font-weight:700; letter-spacing:.4px; text-decoration:none; cursor:pointer; }
        .btn:hover { opacity:.88; }
        .btn-secondary { background:transparent; color:var(--ink); }
        .btn:disabled { opacity:.55; cursor:wait; }
        .status-active { color:var(--green); font-weight:700; }
        .status-due { color:#bd6b14; font-weight:700; }
        .status-retired { color:#a44942; font-weight:700; }
        @media (max-width:600px) { .container { width:100%; } }
    </style>
</head>
<body>
    <header class="site-header"></header>
    <main class="container">{% block content %}{% endblock %}</main>
    <footer class="site-footer">© 2026 Namah Ropes | Rope Passport System</footer>
</body>
</html>
